apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: proxy
          image: watchtower:latest
          imagePullPolicy: Never
          command: ["python", "proxy/proxy.py"]
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: WATCHTOWER_DB_PATH
              value: "/tmp/watchtower.db"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
spec:
  selector:
    app: proxy
  ports:
    - port: 8000
      targetPort: 8000
  type: NodePort