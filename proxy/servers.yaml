# Watchtower multi-server config. Each entry is one upstream MCP server
# Watchtower connects to and aggregates. Scripts are resolved relative to
# this file's own directory (proxy/), same convention as the rest of the
# project.
servers:
  - name: filesrv
    script: ../vulnerable-server/server.py
  - name: mailsrv
    script: ../lab-server-b/mailserver.py